<svg xmlns="http://www.w3.org/2000/svg"
     width="74"
     height="74"
     viewBox="0 0 64 64"
     fill="none">

  <defs>
    <linearGradient id="headphoneGradient"
      x1="8" y1="5" x2="56" y2="59">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="headphoneGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="2.8"
        flood-color="#A855F7"
        flood-opacity=".8"/>

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="6"
        flood-color="#7C3AED"
        flood-opacity=".25"/>
    </filter>
  </defs>

  <g filter="url(#headphoneGlow)">

    <!-- Headphone Arc -->
    <path
      d="M12 34
         V29
         C12 17 21 8 32 8
         C43 8 52 17 52 29
         V34"
      stroke="url(#headphoneGradient)"
      stroke-width="3.2"
      stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <path
      d="M12 31
         C9.8 31 8 32.8 8 35
         V45
         C8 47.2 9.8 49 12 49
         H16
         V31
         Z"
      fill="#17102F"
      stroke="url(#headphoneGradient)"
      stroke-width="2.2"/>

    <!-- Right Ear Cup -->
    <path
      d="M52 31
         C54.2 31 56 32.8 56 35
         V45
         C56 47.2 54.2 49 52 49
         H48
         V31
         Z"
      fill="#17102F"
      stroke="url(#headphoneGradient)"
      stroke-width="2.2"/>

    <!-- Inner Ear Glow -->
    <path
      d="M12 36 V44"
      stroke="#C084FC"
      stroke-width="1.5"
      stroke-linecap="round"/>

    <path
      d="M52 36 V44"
      stroke="#C084FC"
      stroke-width="1.5"
      stroke-linecap="round"/>

    <!-- Headphone Bottom Connection -->
    <path
      d="M16 49
         C18 54 23 57 29 57
         H36"
      stroke="url(#headphoneGradient)"
      stroke-width="2"
      stroke-linecap="round"/>

  </g>

</svg>