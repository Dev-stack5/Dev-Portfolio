<svg xmlns="http://www.w3.org/2000/svg"
     width="74"
     height="74"
     viewBox="0 0 64 64"
     fill="none">

  <defs>

    <!-- Same Purple Gradient -->
    <linearGradient id="settingGradient"
      x1="8" y1="6" x2="56" y2="58">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Dark Center -->
    <radialGradient id="settingCenter">
      <stop offset="0%" stop-color="#24134A"/>
      <stop offset="100%" stop-color="#08051A"/>
    </radialGradient>

    <!-- Same Neon Shadow -->
    <filter id="settingGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="2.8"
        flood-color="#A855F7"
        flood-opacity=".8"/>

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="6"
        flood-color="#7C3AED"
        flood-opacity=".25"/>

    </filter>

  </defs>

  <!-- Gear -->
  <g filter="url(#settingGlow)">

    <path
      d="M52.2 34.8
         C52.5 33.8 52.5 32.9 52.5 32
         C52.5 31.1 52.5 30.2 52.2 29.2
         L57 25.6
         L52.2 17.3
         L46.7 19.5
         C45.3 18.3 43.8 17.4 42.1 16.8
         L41.3 11
         H31.7
         L30.9 16.8
         C29.2 17.4 27.7 18.3 26.3 19.5
         L20.8 17.3
         L16 25.6
         L20.8 29.2
         C20.5 30.2 20.5 31.1 20.5 32
         C20.5 32.9 20.5 33.8 20.8 34.8
         L16 38.4
         L20.8 46.7
         L26.3 44.5
         C27.7 45.7 29.2 46.6 30.9 47.2
         L31.7 53
         H41.3
         L42.1 47.2
         C43.8 46.6 45.3 45.7 46.7 44.5
         L52.2 46.7
         L57 38.4
         Z"

      fill="url(#settingCenter)"
      stroke="url(#settingGradient)"
      stroke-width="2.2"
      stroke-linejoin="round"/>

    <!-- Center Circle -->
    <circle
      cx="36.5"
      cy="32"
      r="8"
      fill="#0B0920"
      stroke="#C084FC"
      stroke-width="2"/>

    <!-- Center Glow -->
    <circle
      cx="36.5"
      cy="32"
      r="3"
      fill="#A855F7"
      opacity=".7"/>

  </g>

</svg>