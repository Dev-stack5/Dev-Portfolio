<svg xmlns="http://www.w3.org/2000/svg"
     width="74"
     height="74"
     viewBox="0 0 64 64"
     fill="none">

  <defs>
    <linearGradient id="paletteGradient"
      x1="8" y1="6" x2="56" y2="58">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="paletteGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="2.8"
        flood-color="#A855F7"
        flood-opacity=".8"/>

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="6"
        flood-color="#7C3AED"
        flood-opacity=".25"/>
    </filter>
  </defs>

  <g filter="url(#paletteGlow)">

    <!-- Artist Palette -->
    <path
      d="M32 8
         C18.7 8 8 17.7 8 29.8
         C8 42.1 18.1 52 30.8 52
         H35.5
         C38.2 52 40.2 49.7 39.4 47.2
         C38.5 44.1 40.8 41.2 44 41.2
         H47
         C52.2 41.2 56 37.1 56 31.9
         C56 18.7 45.2 8 32 8Z"
      fill="#17102F"
      stroke="url(#paletteGradient)"
      stroke-width="2.2"
      stroke-linejoin="round"/>

    <!-- Paint Colors -->

    <circle cx="20" cy="24" r="4"
            fill="#C084FC"/>

    <circle cx="31" cy="19" r="4"
            fill="#A855F7"/>

    <circle cx="42" cy="23" r="4"
            fill="#7C3AED"/>

    <circle cx="19" cy="36" r="4"
            fill="#8B5CF6"/>

    <circle cx="30" cy="39" r="4"
            fill="#C084FC"/>

    <!-- Thumb Hole -->
    <circle
      cx="45"
      cy="32"
      r="5"
      fill="#0B0920"
      stroke="#A855F7"
      stroke-width="1.8"/>

  </g>

</svg>